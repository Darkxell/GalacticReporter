<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Galactic Reporter Demo</title>
</head>

<body>
    <script type="module">
        import { loadDataset, computeProfile } from "../source/GalacticReporter.js";

        async function runDemo() {
            try {
                // Load the datasets
                const response = await fetch("../GalacticBlueprints/items.json");
                const dataset = await response.json();
                const loadResult = loadDataset(dataset);
                console.log("loadDataset() returned:", loadResult);

                // Create a ship from presets
                ship = {}

                // Compute the damage profile for the ship we just made
                const profile = computeProfile(ship, 60);
                console.log("computeProfile() returned:", profile);

            } catch (err) {
                console.error("Galactic reporter demo failed.\n", err);
            }
        }

        runDemo();
    </script>
</body>

</html>
