<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Galactic Reporter Demo</title>
</head>

<body>
    <script type="module">
        import { loadDataset, fetchPresets, computeProfile } from "../source/GalacticReporter.js";

        async function runDemo() {
            try {
                // Load the datasets
                const datasets = ["items.json", "ships.json", "systems.json"];
                const responses = await Promise.all( datasets.map(name => fetch(`../GalacticBlueprints/${name}`)));
                const data = await Promise.all(responses.map(response => response.json()));
                data.forEach(loadDataset);
                console.log("Datasets loaded to GalacticReporter!");

                // Create a ship from presets
                var presets = fetchPresets();
                console.log("Ship presets :");
                console.log(presets);

                // For demo purposes, we just take the last ship in the presets
                var ship = presets.at(-1);

                // Compute the damage profile for the ship we just made
                // 60 seconds, 1 ennemy
                const profile = computeProfile(ship, 60, 1);
                console.log("Computed damage profile :");
                console.log(profile);

            } catch (err) {
                console.error("Galactic reporter demo failed.\n", err);
            }
        }

        runDemo();
    </script>
</body>

</html>
